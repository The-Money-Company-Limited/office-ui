<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document artifact</title>
    <script>
      try {
        const theme =
          localStorage.getItem("cool-computers-theme") === "light"
            ? "light"
            : "dark"
        document.documentElement.classList.toggle("dark", theme === "dark")
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.classList.add("dark")
        document.documentElement.style.colorScheme = "dark"
      }
    </script>
    <link rel="stylesheet" href="./vendor/app.css" data-app-css />
  </head>
  <body class="artifact-page">
    <div id="root"></div>
    <!-- loader.js turns src/**/*.tsx into one cached script and runs it. -->
    <script type="module" src="./loader.js"></script>
  </body>
</html>
